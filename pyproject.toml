[project]
name = "xhandler"
# The version of the core it carries (make sync), e.g. 6.0.0-alpha.1 -> 6.0.0a1
dynamic = ["version"]
description = "Create, sign and send the electronic documents (UBL XML) of SUNAT Peru"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "wasmtime>=30",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/xhandler/_core/VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/xhandler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/xhandler/xbuilder/models.py", "src/xhandler/xsender/models_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
